// app/build.gradle
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.dsh.doropet'
    compileSdk 34

    defaultConfig {
        applicationId "com.dsh.doropet"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "0.1"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
